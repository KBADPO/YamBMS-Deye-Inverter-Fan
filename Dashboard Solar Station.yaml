  # - title: Solcast
  - path: solcast
    icon: mdi:weather-sunny
    cards:
      - type: custom:apexcharts-card
        header:
          show: true
          title: Прогноз на сьогодні та завтра
          show_states: false
        graph_span: 2d
        span:
          start: day
        now:
          show: true
          label: Зараз
        series:
          - entity: sensor.solcast_pv_forecast_forecast_today
            name: Сьогодні
            type: area
            color: '#ff9800'
            opacity: 0.5
            extend_to: false
            unit: kW
            show:
              in_header: false
              legend_value: false
            data_generator: >
              let f = entity.attributes.detailedForecast ||
              entity.attributes.forecast;

              if (!f) return [];

              return f.map((entry) => {
                let pv = entry.pv_estimate || 0;
                return [new Date(entry.period_start).getTime(), pv];
              });
          - entity: sensor.solcast_pv_forecast_forecast_tomorrow
            name: Завтра
            type: area
            color: '#3498db'
            opacity: 0.5
            extend_to: false
            unit: kW
            show:
              in_header: false
              legend_value: false
            data_generator: >
              let f = entity.attributes.detailedForecast ||
              entity.attributes.forecast;

              if (!f) return [];

              return f.map((entry) => {
                let pv = entry.pv_estimate || 0;
                return [new Date(entry.period_start).getTime(), pv];
              });
          - entity: sensor.deye_inverter_pv1_power
            name: Факт PV1
            type: line
            color: '#8BC34A'
            stroke_width: 2
            unit: kW
            transform: 'return x / 1000;'
            group_by:
              func: avg
              duration: 30m
          - entity: sensor.deye_inverter_pv2_power
            name: Факт PV2 (Південь)
            type: line
            color: '#4CAF50'
            stroke_width: 2
            unit: kW
            transform: 'return x / 1000;'
            group_by:
              func: avg
              duration: 30m
      - type: custom:apexcharts-card
        experimental:
          color_threshold: true
        header:
          show: true
          title: Прогноз на тиждень (кВт⋅год)
          show_states: false
        graph_span: 7d
        span:
          start: day
        apex_config:
          stroke:
            curve: smooth
            width: 3
        series:
          - entity: sensor.solcast_pv_forecast_forecast_today
            name: Прогноз
            type: area
            opacity: 0.3
            extend_to: false
            show:
              datalabels: true
            color_threshold:
              - value: 5
                color: '#f44336'
              - value: 10
                color: '#ffc107'
              - value: 32
                color: '#8bc34a'
            data_generator: |
              const today = new Date();
              today.setHours(12,0,0,0);
              let data = [];
              const days = [
                'sensor.solcast_pv_forecast_forecast_today',
                'sensor.solcast_pv_forecast_forecast_tomorrow',
                'sensor.solcast_pv_forecast_forecast_day_3',
                'sensor.solcast_pv_forecast_forecast_day_4',
                'sensor.solcast_pv_forecast_forecast_day_5',
                'sensor.solcast_pv_forecast_forecast_day_6',
                'sensor.solcast_pv_forecast_forecast_day_7'
              ];
              days.forEach((entity_id, index) => {
                let stateObj = hass.states[entity_id];
                if (stateObj && !isNaN(stateObj.state)) {
                   let ts = today.getTime() + (index * 24 * 60 * 60 * 1000);
                   data.push([ts, parseFloat(stateObj.state)]);
                }
              });
              return data;
      - type: entities
        title: Деталі прогнозу
        entities:
          - entity: sensor.solcast_pv_forecast_forecast_today
            name: Прогноз на сьогодні
          - entity: sensor.solcast_pv_forecast_forecast_remaining_today
            name: Залишилось на сьогодні
          - entity: sensor.solcast_pv_forecast_forecast_tomorrow
            name: Прогноз на завтра
          - entity: sensor.solcast_pv_forecast_peak_time_today
            name: Час піку сьогодні
          - entity: sensor.solcast_pv_forecast_peak_time_tomorrow
            name: Час піку завтра
          - entity: sensor.solcast_pv_forecast_power_now
            name: Поточна генерація
      - type: entities
        title: Статус API
        entities:
          - entity: sensor.solcast_pv_forecast_api_last_polled
            name: Останнє оновлення
          - entity: sensor.solcast_pv_forecast_api_used
            name: Використано API
          - entity: sensor.solcast_pv_forecast_api_limit
            name: Ліміт API
          - entity: sensor.solar_kvadro
            name: Solar.kvadro
  # - title: YamBMS
  - icon: mdi:car-battery
