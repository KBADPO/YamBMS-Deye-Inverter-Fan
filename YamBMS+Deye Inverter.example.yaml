logger:
  level: INFO # VERBOSE / DEBUG / INFO / WARN
  # baud_rate: 115200 # Send logs to the `hardware_uart` USB output (this consumes a UART interface)
  # hardware_uart: UART0 # UART0 / USB_SERIAL_JTAG

ota:
  - platform: esphome

# Uncomment:
# API: to monitor entities via Home Assistant
# MQTT: to monitor entities via another system
# Neither: to monitor entities only via `web_server` or nothing

api:
  reboot_timeout: 0s
  encryption:
    key: ${api_key}

# mqtt:
#   broker: !secret mqtt_host
#   username: !secret mqtt_username
#   password: !secret mqtt_password
