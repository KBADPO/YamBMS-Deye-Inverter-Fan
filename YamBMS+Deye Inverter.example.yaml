# +--------------------------------------+
# | Global Settings                      |
# +--------------------------------------+
substitutions:
  # This project uses the `sub-device` function of ESPHome to prefix entity names.
  # This allows to group entities into logical devices that appear separately in Home Assistant.
  hostname: 'deye-yambms-fan' # Name of your ESPHome node registered on the IP network (DNS name must be unique)
  friendly_name : 'Deye+YamBms+Fan' # Name of your board (prefix for board entities)
  name: 'deye-yambms-fan' # Override Lewa-Reka's node name
  modbus_controller_id: 'deye_modbus_controller' # Used by Fan logic to read Modbus sensors
  # +--------------------------------------+
  # | YamBMS Settings                      |
  # +--------------------------------------+
  # Please read the cut-off charging logic README to understand how the YamBMS works
  yambms_id: '1' # Number without spaces
  yambms_name: 'YamBMS 1' # Prefix for YamBMS entities
  yambms_update_interval: '1s'
  # Input numbers can be displayed as a slider or an input box, options are 'slider' or 'box'.
  yambms_input_number_mode: 'slider'
  # Please check and fill in the options below correctly according to your battery chemistry and number of cells in series.
  # These parameters are important and used for charging logic.
  # Battery Chemistry
  yambms_battery_chemistry: '1' # 1-LFP | 2-Li-ion | 3-LTO
  # Number of cells in series
  yambms_cell_count: '16'
  # Bulk / Absorption Voltage : corresponds to the Bulk voltage that will be used to charge the battery. (LFP : 55.2V = 3.45V/Cell for 16S battery)
  yambms_bulk_v: '55.5'
  # Float Voltage : corresponds to the voltage at which the battery would be maintained at the end of charge. (LFP : 53.6V = 3.35V/Cell for 16S battery)
  yambms_float_v: '54' # Raised to 3.4V per cell to allow balancing to work even in float (if balancer threshold is 3.4V) / Піднято до 3.4V на комірку, щоб дозволити балансуванню працювати навіть у флоаті (якщо поріг балансира 3.4V)
  # Rebulk voltage, voltage from which a new Bulk charge can start. (LFP : 52.8V = 3.3V/Cell for 16S battery)
  yambms_rebulk_v: '53.0'
  # Maximum time in minutes that the cut-off step can last before charging is complete
  # If your cells are properly balanced this step ends at the fastest after the `cut-off timer`
  # This timer can be deactivated with a switch
  yambms_eoc_timer: '90' # Increased from 30 to 120 minutes to allow more time for balancing / Збільшено з 30 до 120 хвилин, щоб дати більше часу на балансування
  # Time in seconds during which the end of charge conditions must be respected (cut-off + cells not equalizing)
  yambms_cutoff_timer: '60'
  # Max. charge current : corresponds to the maximum charge current which may be requested by YamBMS.
  # The current requested will be proportional to the BMS count without ever exceeding this value.
  yambms_max_requested_charge_current: '80' # in Ampere
  # Max. discharge current : corresponds to the maximum discharge current which may be requested by YamBMS.
  # The current requested will be proportional to the BMS count without ever exceeding this value.
  yambms_max_requested_discharge_current: '120' # in Ampere
  # +-------------------------------------------------------------------------
  # | Temperature-based current limitation
  # | Can be disabled via the switch "Temperature-based current limitation"
  # | This factor is applied to the battery capacity (Ah), not the current 
  # | maximum charge/discharge current. For example : 280Ah x 0.5 = 140A
  # +-------------------------------------------------------------------------
  # Temperature °C -> Charge Rate (0.0C to 1.0C)
  yambms_charging_rate_table: |
    {
      { -0.1, 0.00 },
      {  0.0, 0.05 },
      {  5.0, 0.12 },
      { 10.0, 0.30 },
      { 20.0, 0.50 },
      { 25.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.25 },
      { 55.0, 0.10 },
      { 60.0, 0.00 }
    }
 # Temperature °C -> Discharge Rate (0.0C to 1.0C)
  yambms_discharging_rate_table: |
    {
      {-30.0, 0.00 },
      {-20.0, 0.00 },
      {-10.0, 0.05 },
      { -5.0, 0.10 },
      {  0.0, 0.25 },
      {  5.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.25 },
      { 55.0, 0.10 },
      { 60.0, 0.00 }
    }
  # +--------------------------------------+
  # | Shunt Settings                       |
  # +--------------------------------------+
  shunt_update_interval: '3s'  # frequency at which Shunt data is refreshed
  # +--------------------------------------+
  # | BMS Settings                         |
  # +--------------------------------------+
  bms_update_interval: '3s'    # frequency at which BMS data is refreshed, going below '3s' can cause problems
  # +--------------------------------------+
  # | Health & LED Assignment Logs         |
  # +--------------------------------------+
  enable_led_logging: 'false'     # Set to true to see if an led is assigned to a component correctly, logged every 60 seconds
  enable_health_logging: 'false'  # Set to true to see if component health for all component instances, logged every 60 seconds
  # --- WiFi & API Secrets ---
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  domain: !secret domain
  api_key: !secret api_key

  # --- PV Inverter Deye SG0XLP1 ---
  ota_password: !secret ota_password
  fallback_password: !secret fallback_password
  modbus_inverter_address: "0x01" # Default Modbus address, should be changed to match inverter settings
  # Safe Mode parameters for supported inverters
  safe_mode_delay: 600s # Time after which transition to safe mode and setting default operating parameters will occur
  default_maximum_battery_charge_current: "80" # Amps
  default_max_sell_power: "6000" # Watts. Adjust to your inverter
  default_system_work_mode: "Zero Export To CT" # "Selling First", "Zero Export To Load", "Zero Export To CT"
  default_solar_sell: "off" # "on", "off"


# +--------------------------------------+
# | Packages                             |
# +--------------------------------------+

# PLEASE READ : https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_RP_YAML.md

