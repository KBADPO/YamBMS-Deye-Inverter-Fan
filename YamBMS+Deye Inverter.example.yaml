# +------------------------------------------------------------------------------+
# | >>> Add your custom YAML below
# +----- -------------------------------------------------------------------------+

esphome:
  devices:
    - id: inverter_fan_device
      name: "Inverter Cooling Fan"

# Custom YAML
light:
  - id: !extend esp_light
    color_correct: [30%, 30%, 30%]

# --- PV Inverter Deye UART & Modbus ---
uart:
  # Default TX and RX pins, if TTL converter is connected differently, set appropriate pins
  tx_pin: GPIO17
  rx_pin: GPIO16

modbus:
#  flow_control_pin: GPIO4 # Uncomment and set appropriate pin if your TTL converter requires it

# --- 20kHz PWM Cooling Fan Control & Smart Logic ---
output:
  - platform: ledc
    pin: GPIO18
    id: fan_pwm_output
    frequency: 20000Hz



# --- Home Assistant Controls ---
number:
  - platform: template
    name: "Fan Speed Target"
    id: fan_speed_target
    device_id: inverter_fan_device
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    unit_of_measurement: "%"
    icon: "mdi:fan"
    set_action:
      - lambda: |-
          id(fan_pwm_output).set_level(x / 100.0f);
          id(fan_speed_target).publish_state(x);

# --- Safety Automation (Loss of Connection) ---
interval:
  - interval: 10s
    then:
      - if:
          condition:
            not:
              api.connected:
          then:
            - lambda: |-
                id(fan_pwm_output).set_level(0.10f);
