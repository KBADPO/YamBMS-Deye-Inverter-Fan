  # +------------------------------------------------------------------------------+
  # | >>> BMS / Balancer / Shunt
  # +------------------------------------------------------------------------------+

  # You don't have to import a shunt but you must import at least one BMS.
  # You can mix different BMS models, the only condition is that the `bms_id` are numbered in order starting from 1 !

  # >>> Copy your BMS / Balancer / Shunt packages here
  # >>> You can find examples at this address :
  # >>> https://github.com/Sleeper85/esphome-yambms/tree/main/examples/single-node/



      # BMS 1
      - path: 'packages/bms/bms_combine_JK_BLE_standard.yaml'
        vars:
          bms_id: '1' # must be a number
          bms_name: 'JK-BMS 1'
          bms_ble_protocol_version: 'JK02_32S' # JK02_24S < hardware version 11.0 >= JK02_32S
          bms_ble_mac_address: 'c8:47:80:1b:78:d7'
          # Maximum cell charging cycles is used to calculate the battey SoH.
          # MB31=8000.0, LF280K v3=8000.0, LF280K v2=6000.0, LF280=3000.0 (decimal is required)
          bms_cell_max_cycles: '3000.0'
          bms_status_led_id: 'esp_light' # LED used to show status; default = esp_light, comment out to disable
      



  # +------------------------------------------------------------------------------+
  # | >>> YamBMS
  # +------------------------------------------------------------------------------+

      - path: 'packages/yambms/yambms.yaml'



  # +------------------------------------------------------------------------------+
  # | >>> CAN bus to Inverter
  # +------------------------------------------------------------------------------+

      - path: 'packages/yambms/yambms_canbus.yaml' # yambms_canbus_web_server.yaml
        vars:
          canbus_id: '1' # must be a number
          canbus_name: 'CANBUS 1'
          canbus_node_id: 'canbus_inverter_1' # CAN bus node to which your inverter is connected
          canbus_status_led_id: 'esp_light' # LED used to show status; default = esp_light, comment out to disable
          # CAN frames sending will be paused for `30s` if the inverter does not respond with an ACK (can_id 0x305) before the end of the `canbus_link_timer` (5s by default).
          canbus_link_timer_enabled: 'true' # Set it to 'false' if your inverter/charger is not sending ACK (can_id 0x305) every `1s` as specified by the protocol
          canbus_link_timer: '5s'
          canbus_extended_ack: 'false' # Set to 'true' for enable extended 29-bit IDs (required for Schneider XW Pro)



  # +------------------------------------------------------------------------------+
  # | >>> RS485 bus to Inverter
  # +------------------------------------------------------------------------------+

  #     - path: 'packages/yambms/yambms_rs485_pylon.yaml' # yambms_rs485_pylon_web_server.yaml
  #       vars:
